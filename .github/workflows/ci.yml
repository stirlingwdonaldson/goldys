name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (test, format, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Release preflight regression checks
        run: python3 -m unittest discover -s ops/releases/2026-10-16-data-correctness -p 'test_*.py' -v

      - name: Test, format check, and build
        working-directory: backend
        run: ./gradlew test spotlessCheck build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type check, lint, test, and build
        working-directory: frontend
        run: bun run typecheck && bun run lint && bun run test && bun run build

  agent-worker:
    name: Pi adapter (synthetic contracts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install locked packages without lifecycle scripts
        working-directory: agent-worker
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check, test, and build
        working-directory: agent-worker
        run: bun run typecheck && bun run test && bun run build

  forecast:
    name: Forecast runtime (CPU tests, fake TimesFM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast-service/requirements-test.txt
      - name: Install test dependencies without TimesFM weights
        run: python -m pip install -r forecast-service/requirements-test.txt
      - name: Test forecasting without external services
        working-directory: forecast-service
        env:
          TIMESFM_PREWARM: "false"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python -m pytest -q

  docker:
    name: Docker images (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t goldys-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t goldys-frontend:ci ./frontend

      - name: Build Pi worker image (synthetic tests, no provider credentials)
        run: docker build -t goldys-agent-worker:ci ./agent-worker

      - name: Worker fails closed without configuration
        shell: bash
        run: |
          set +e
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=64 --memory=512m --cpus=1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            goldys-agent-worker:ci > worker-startup.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'Missing worker configuration: GOLDYS_SPRING_ORIGIN' worker-startup.log

      - name: Scan worker runtime for high and critical vulnerabilities
        shell: bash
        run: |
          docker save --output "$RUNNER_TEMP/pi-worker.tar" goldys-agent-worker:ci
          mkdir -p "$RUNNER_TEMP/pi-trivy-cache"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --pids-limit=64 --memory=1g --cpus=1 --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --mount "type=bind,src=$RUNNER_TEMP/pi-worker.tar,dst=/image.tar,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/pi-trivy-cache,dst=/cache" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --cache-dir /cache --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1
