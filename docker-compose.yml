# Development only. For the production stack (backend + frontend + Postgres,
# served from platform.swd.sh), see docker-compose.prod.yml and docs/operations/deployment.md.
#
# Local dev Postgres only.
#
# Published on host port 5433, not 5432: a native Postgres (Homebrew, Postgres.app,
# a system service) commonly already owns 5432, and binding would fail with a
# confusing "port is already allocated". The app defaults to 5432 for a native
# instance, so when using this container point it here explicitly:
#
#   docker compose up -d
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/goldys ./gradlew test
#
# Still unverified end-to-end: no Docker daemon was running in the sessions that
# wrote this. Confirm `docker compose up` brings Postgres up and that the
# migration in backend/src/main/resources/db/migration applies cleanly.
#
# The database is disposable - Flyway owns the schema, so prefer
# `docker compose down -v` over hand-editing tables when something looks wrong.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: goldys
      POSTGRES_USER: goldys
      POSTGRES_PASSWORD: goldys_local_dev_only
    ports:
      - "5433:5432"
    volumes:
      - goldys_pg_data:/var/lib/postgresql/data

  # Self-hosted TimesFM inference service (Python/FastAPI) for forecasting. The model
  # is downloaded lazily on first warm-up into TIMESFM_CACHE_DIR, mounted as a named
  # volume so restarts don't re-download it. Production wiring (docker-compose.prod.yml)
  # is gated on explicit approval in Task 9.
  timesfm:
    build: ./forecast-service
    ports:
      - "8001:8001"
    volumes:
      - timesfm_cache:/timesfm-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  goldys_pg_data:
  timesfm_cache:
