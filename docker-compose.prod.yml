# Production stack for this VM. HTTPS is terminated at the operator's edge, which
# forwards platform.swd.sh to ${PORT:-3000}. Only the frontend is published;
# backend and Postgres live on the internal network.
#
#   cp .env.example .env.prod    # fill in real values
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# A distinct project name keeps the prod containers and Postgres volume separate
# from the dev stack (docker-compose.yml), so a dev `docker compose down -v`
# never touches production data.
#
# Override with COMPOSE_PROJECT_NAME to run a second, isolated instance (e.g. a
# staging/dev deployment on a different port and its own database volume):
#   COMPOSE_PROJECT_NAME=goldys-dev PORT=3001 docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml up -d --build

name: ${COMPOSE_PROJECT_NAME:-goldys-prod}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldys}
      POSTGRES_USER: ${POSTGRES_USER:-goldys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - goldys_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goldys}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-goldys}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      CTB_EMAIL: ${CTB_EMAIL:-}
      CTB_PASSWORD: ${CTB_PASSWORD:-}
      CTB_DROP_TOKEN: ${CTB_DROP_TOKEN:-}
      LIGHTSPEED_WEBHOOK_TOKEN: ${LIGHTSPEED_WEBHOOK_TOKEN:-}
      OPENTABLE_DROP_TOKEN: ${OPENTABLE_DROP_TOKEN:-}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APP_LIGHTSPEED_BACKFILL: ${APP_LIGHTSPEED_BACKFILL:-}
      # Sentry (ops-sentry). Unset DSN = SDK off. SENTRY_RELEASE is the deployed git SHA.
      SENTRY_DSN: ${SENTRY_BACKEND_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are inlined into the browser bundle at build time.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_SENTRY_FEEDBACK: ${SENTRY_FEEDBACK:-false}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        # Source map upload target. Use Sentry's internal address: the public hostname's
        # management API sits behind Cloudflare Access.
        SENTRY_URL: ${SENTRY_URL:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_FRONTEND_PROJECT:-goldys-frontend}
      secrets:
        - sentry_auth_token
    environment:
      PORT: "3000"
      # Server-side SDK + the /monitoring tunnel that relays browser events to Sentry.
      SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Optional: where the tunnel forwards to (e.g. http://192.168.4.36:9000). Defaults to the
      # DSN's own host.
      SENTRY_TUNNEL_TARGET: ${SENTRY_TUNNEL_TARGET:-}
    ports:
      # Bind to 127.0.0.1 when the edge reaches this VM over a tunnel
      # (cloudflared etc.); use 0.0.0.0 only with a host firewall restricting the
      # port to the edge's IP ranges. See docs/deployment.md.
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  goldys_pg_data:

secrets:
  # Sentry org auth token for source map upload during the frontend image build. Read from the
  # environment, never written to the image. Unset = build still succeeds, no source maps.
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
