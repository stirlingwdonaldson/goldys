worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Spring bounds snapshots to 8M Java characters; allow their UTF-8 envelope.
  client_max_body_size 32m;
  # Backend container addresses can change on redeploy without recreating this proxy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/pi/server.crt;
    ssl_certificate_key /etc/pi/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/workspace-worker/ {
      set $backend http://backend:8080;
      proxy_pass $backend;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location / { return 404; }
  }
}
