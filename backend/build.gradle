plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.goldys'
version = '0.1.0-SNAPSHOT'
description = "Goldy's unified data platform - backend"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Operational metrics: micrometer core + actuator endpoints + Prometheus export.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'

	// Schema is owned by versioned migrations, not Hibernate auto-DDL - see
	// src/main/resources/db/migration and the ddl-auto comment in application.yml.
	// flyway-database-postgresql is a separate artifact as of Flyway 10.
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.commons:commons-csv:1.11.0'

	// Spring AI 1.1.x is the Spring Boot 3.5-compatible line (2.x requires Boot 4).
	implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers 1.x defaults docker-java to API 1.32, which Docker 29+
	// rejects. API 1.40 is supported from Docker 19.03 onward and remains
	// overridable for unusual environments with -Dapi.version=<version>.
	systemProperty 'api.version', System.getProperty('api.version', '1.40')
}

spotless {
	java {
		googleJavaFormat('1.28.0')
		target 'src/**/*.java'
	}
}
