plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.goldys'
version = '0.1.0-SNAPSHOT'
description = "Goldy's unified data platform - backend"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	runtimeOnly 'org.postgresql:postgresql'

	// Schema is owned by versioned migrations, not Hibernate auto-DDL - see
	// src/main/resources/db/migration and the ddl-auto comment in application.yml.
	// flyway-database-postgresql is a separate artifact as of Flyway 10.
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.commons:commons-csv:1.11.0'

	// Spring AI: needed for the Conversational BI / Smart Exporter tool-calling
	// framework (Phase 2, spec Requirements 9-10), not Phase 1. Coordinates and
	// version are deliberately left unpinned here - Spring AI's artifact IDs and
	// BOM version have moved fast; pin the current one when Phase 2 scaffolding
	// (Requirement 11) actually starts, rather than guessing now.
	// implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers 1.x defaults docker-java to API 1.32, which Docker 29+
	// rejects. API 1.40 is supported from Docker 19.03 onward and remains
	// overridable for unusual environments with -Dapi.version=<version>.
	systemProperty 'api.version', System.getProperty('api.version', '1.40')
}

spotless {
	java {
		googleJavaFormat('1.28.0')
		target 'src/**/*.java'
	}
}
