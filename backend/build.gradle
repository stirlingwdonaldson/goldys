plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.goldys'
version = '0.1.0-SNAPSHOT'
description = "Goldy's unified data platform - backend"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Operational metrics: micrometer core + actuator endpoints + Prometheus export.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// Error tracking, tracing and cron monitoring (self-hosted Sentry). Inert when SENTRY_DSN is
	// unset, so local dev and tests are unaffected. Boot 3.x uses the -jakarta starter.
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.59.0'
	runtimeOnly 'org.postgresql:postgresql'

	// Schema is owned by versioned migrations, not Hibernate auto-DDL - see
	// src/main/resources/db/migration and the ddl-auto comment in application.yml.
	// flyway-database-postgresql is a separate artifact as of Flyway 10.
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.apache.commons:commons-csv:1.11.0'
	// Invoice PDF text extraction (behind the DocumentTextExtractor port, so it is swappable).
	implementation 'org.apache.pdfbox:pdfbox:3.0.4'

	// Spring AI 1.1.x is the Spring Boot 3.5-compatible line (2.x requires Boot 4).
	implementation platform('org.springframework.ai:spring-ai-bom:1.1.8')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// SFTP drop delivery (transport behind the SftpDrop port, so it is swappable).
	implementation 'org.springframework.integration:spring-integration-sftp'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers 1.x defaults docker-java to API 1.32, which Docker 29+
	// rejects. API 1.40 is supported from Docker 19.03 onward and remains
	// overridable for unusual environments with -Dapi.version=<version>.
	systemProperty 'api.version', System.getProperty('api.version', '1.40')
}

// Fast inner-loop lane for local development. The full `test` task runs every
// suite — the ~50 `*IntegrationTest` classes plus a set of older Spring suites
// that predate the suffix — and those dominate the ~2 minute wall clock because
// each boots a Spring context and/or a PostgreSQL Testcontainer. `fastTest` runs
// only the pure, Spring-free unit tests: no Docker, no context startup, and the
// classes run in parallel (safe because nothing shares the database). Use it
// while iterating and reserve `./gradlew test` (or `build`) for the pre-commit
// gate. For the tightest loop, target a class or package directly:
//   ./gradlew test --tests 'com.goldys.platform.reconciliation.*'
tasks.register('fastTest', Test) {
	description = 'Unit tests only: skips Spring-context and PostgreSQL suites (fast inner loop).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'api.version', System.getProperty('api.version', '1.40')
	// Class-level parallelism only: methods within a class stay on one thread, so
	// any test relying on per-class ordering or state is unaffected.
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
	systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
	systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
	systemProperty 'junit.jupiter.execution.parallel.config.strategy', 'dynamic'
	filter {
		// Every *IntegrationTest starts a PostgreSQL 16 Testcontainer.
		excludeTestsMatching '*IntegrationTest'
		// Spring-context and/or PostgreSQL suites that predate the naming
		// convention. Keep this list in sync when adding a Spring/Postgres test
		// without the suffix, otherwise the "fast" lane silently needs Docker.
		// (Generated by scanning src/test for @SpringBootTest / @WebMvcTest /
		// @DataJpaTest / @Import / PostgresContainerConfiguration.)
		[
			'AuthControllerTest',
			'CanonicalSchemaTest',
			'ChatControllerSseTest',
			'ChatControllerTest',
			'ConnectorRunnerTest',
			'ConnectorStatusControllerTest',
			'ConversationRepositoryTest',
			'ConversationalAiConfigTest',
			'ConversationalAiConfigWithKeyTest',
			'ConversationalEvalTest',
			'DashboardControllerTest',
			'DashboardVersioningTest',
			'DataExplorerControllerTest',
			'DatabaseMigrationTest',
			'IngestWebhookSecurityTest',
			'IngestionFailureDetailTest',
			'IngestionFailureStackTraceTest',
			'IngestionLedgerSchemaTest',
			'IngestionServicesTest',
			'InventoryControllerTest',
			'JpaPermissionLookupTest',
			'LightspeedIngestControllerSecurityTest',
			'LightspeedIngestControllerTest',
			'LiveLlmEvalTest',
			'LlmInvoicePdfExtractorEvalTest',
			'PlatformMapControllerTest',
			'ProvenanceControllerTest',
			'RecipeControllerTest',
			'ReconciliationControllerTest',
			'ReservationControllerTest',
			'ResolutionRuleControllerTest',
			'SalesControllerTest',
			'SavedDashboardControllerTest',
			'SavedDashboardMigrationTest',
			'TradingWeekAcceptanceTest',
			'UserAccountRepositoryTest',
		].each { excluded -> excludeTestsMatching "*${excluded}" }
	}
}

spotless {
	java {
		googleJavaFormat('1.28.0')
		target 'src/**/*.java'
	}
}
