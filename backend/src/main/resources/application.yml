spring:
  application:
    name: goldys-platform
  datasource:
    # Defaults match a native local Postgres (and docker-compose.yml's
    # credentials). Point these elsewhere - docker-compose publishes on 5433,
    # see its comment - with SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/goldys}
    username: ${SPRING_DATASOURCE_USERNAME:goldys}
    password: ${SPRING_DATASOURCE_PASSWORD:goldys_local_dev_only}
  jpa:
    hibernate:
      # Schema is owned by the versioned migrations in db/migration, not by
      # Hibernate. 'validate' makes any drift between the entities and the
      # migrations fail fast at startup. Auto-DDL is the wrong tool here: the
      # raw log is append-only and canonical rows are closed rather than
      # overwritten, so every schema change has to be deliberate and reviewable.
      # Local dev only, per this file's scope - the dev database is disposable.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      # Log any single SQL statement slower than this (ms) under org.hibernate.SQL_SLOW.
      # Surfaces genuinely slow queries; combined with RequestTimingFilter's per-request
      # duration it makes N+1 and slow reads visible in the logs. Tunable per environment.
      hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 200
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Manual CSV drop: allow up to 2 GB per upload. Note the ingestion
      # pipeline reads the file into memory, so in practice the ceiling is the
      # JVM heap — a reservations CSV is KB–MB, nowhere near this.
      max-file-size: 2GB
      max-request-size: 2GB
  ai:
    model:
      # Default OFF so the app boots without a key. The OpenAI chat auto-config is
      # enabled-by-default when the starter is present; `none` disables it. Set
      # SPRING_AI_MODEL_CHAT=openai plus OPENAI_API_KEY to turn Conversational BI on.
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      # A non-empty sentinel (not an empty string) so the connection auto-config's
      # key check passes and the app boots with the feature off. The ChatModel (and
      # thus Conversational BI) stays disabled while spring.ai.model.chat=none.
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0

server:
  port: 8080
  tomcat:
    # Tomcat's own form-post/swallow caps default to 2 MB and would reject a
    # large multipart before Spring's resolver sees it; disable them so the
    # multipart max-file-size above is the effective limit.
    max-swallow-size: -1
    max-http-form-post-size: -1

# Operational metrics. Prometheus scrapes /actuator/prometheus; see
# docs/performance.md for the production hardening note (management port + auth).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.goldys.platform: DEBUG

app:
  conversational:
    system-prompt: prompts/ask-goldys-system.txt
  # Per-domain freshness thresholds (bound by config.FreshnessProperties): how old a
  # domain's last successful ingestion may be before its resolved figures are stale.
  # Provisional values - tune per environment without a rebuild.
  freshness:
    thresholds:
      resolved_daily_sales: 2h
      resolved_reservation_day: 1d
      resolved_labour_day: 1d
      resolved_inventory_day: 7d
      accounting: 30d
