spring:
  application:
    name: goldys-platform
  datasource:
    # Defaults match a native local Postgres (and docker-compose.yml's
    # credentials). Point these elsewhere - docker-compose publishes on 5433,
    # see its comment - with SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/goldys}
    username: ${SPRING_DATASOURCE_USERNAME:goldys}
    password: ${SPRING_DATASOURCE_PASSWORD:goldys_local_dev_only}
  jpa:
    hibernate:
      # Schema is owned by the versioned migrations in db/migration, not by
      # Hibernate. 'validate' makes any drift between the entities and the
      # migrations fail fast at startup. Auto-DDL is the wrong tool here: the
      # raw log is append-only and canonical rows are closed rather than
      # overwritten, so every schema change has to be deliberate and reviewable.
      # Local dev only, per this file's scope - the dev database is disposable.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # OIDC client registration is deployment configuration, not a source-controlled
  # value. The venue's provider details are a gated input (see the Phase 1 spec,
  # "Required Inputs and Decision Gates") and are supplied at deploy time as
  # environment variables:
  #
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOLDYS_CLIENT_ID
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOLDYS_CLIENT_SECRET
  #   SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOLDYS_ISSUER_URI
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOLDYS_SCOPE=openid,profile,email
  #
  # An empty placeholder would fail Spring Boot's provider validation at startup,
  # so the block is deliberately omitted until those values exist.

server:
  port: 8080

logging:
  level:
    com.goldys.platform: DEBUG
