# google-java-format (via the Spotless plugin) reaches into javac internals
# and needs these opened up on JDK 16+ — without them, spotlessApply/Check
# fail with reflection errors on the Gradle daemon's own JVM (which runs on
# JDK 25 here, see root README.md's "Verified state" section for why that
# matters for Gradle itself, not just the toolchain).
org.gradle.jvmargs=--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
